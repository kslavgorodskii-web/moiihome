<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Дом</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; font: 17px/1.4 -apple-system, system-ui, sans-serif;
         background: var(--tg-theme-secondary-bg-color, #f2f2f7); color: var(--tg-theme-text-color, #1c1c1e); }
  @media (prefers-color-scheme: dark) { body { background: #1c1c1e; color: #f2f2f7; } }
  #box { text-align: center; padding: 24px; max-width: 320px; }
  #sub { opacity: .55; font-size: 14px; margin-top: 6px; }
  .spin { width: 28px; height: 28px; margin: 0 auto 16px; border-radius: 50%;
          border: 3px solid currentColor; border-right-color: transparent; opacity: .4;
          animation: r .8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="box"><div class="spin"></div><div id="msg">Подключаюсь к дому…</div><div id="sub"></div></div>
<script>
// Постоянный «вход» в мини-апп умного дома. Бесплатный туннель localhost.run меняет адрес
// каждые несколько минут; сервер дома записывает текущий адрес в gist, а эта страница
// читает его, проверяет, что дом отвечает, и перекидывает туда. Данные входа Telegram
// (#tgWebAppData…) передаются дальше как есть — проверяет их уже сам дом.
const GIST = "https://gist.githubusercontent.com/kslavgorodskii-web/ac1570d6be4b9ed8521a434190d84645/raw/home.json";
const GIST_API = "https://api.github.com/gists/ac1570d6be4b9ed8521a434190d84645";
const HASH = location.hash;
const SELF = location.origin + location.pathname;
const $msg = document.getElementById("msg"), $sub = document.getElementById("sub");

async function withTimeout(url, ms) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  try { return await fetch(url, { cache: "no-store", signal: ctl.signal }); }
  finally { clearTimeout(t); }
}

async function homeInfo() {
  try {  // raw-адрес кэшируется CDN — параметр t обходит кэш
    const j = await (await withTimeout(GIST + "?t=" + Date.now(), 6000)).json();
    if (j.url !== undefined) return j;
  } catch (e) { /* пробуем API */ }
  const g = await (await withTimeout(GIST_API, 6000)).json();
  return JSON.parse(g.files["home.json"].content);
}

async function myIp() {
  try { return (await (await withTimeout("https://api.ipify.org?format=json", 3000)).json()).ip; }
  catch (e) { return ""; }
}

async function alive(base) {
  try { return (await withTimeout(base + "/ping", 6000)).ok; } catch (e) { return false; }
}

// Дома (тот же внешний IP, что у дома) мини-апп открывается напрямую по Wi-Fi: туннель
// бесплатно даёт ~4 КБ/с, а по Wi-Fi видео экрана идёт 30–40 к/с.
// Прямой вход не удался (мини-апп вернулся с ?nolan=1) — 10 минут ходим через туннель.
// Мини-апп, открывшись по Wi-Fi, ставит отметку lanOk в CloudStorage бота. Если прошлая
// попытка была недавно, а отметки после неё нет — Telegram не открыл домашний адрес.
const params = new URLSearchParams(location.search);
if (params.has("nolan")) localStorage.lanBadUntil = Date.now() + 10 * 60 * 1000;

function cloudGet(key) {
  return new Promise((resolve) => {
    const cs = window.Telegram?.WebApp?.CloudStorage;
    if (!cs) return resolve(null);
    setTimeout(() => resolve(null), 1500);
    try { cs.getItem(key, (err, v) => resolve(err ? null : v)); } catch (e) { resolve(null); }
  });
}

async function lanAllowed() {
  if (Date.now() < +(localStorage.lanBadUntil || 0)) return false;
  const tried = +(localStorage.lanTry || 0);
  if (Date.now() - tried > 10 * 60 * 1000) return true;
  return +(await cloudGet("lanOk") || 0) >= tried;
}

async function go() {
  window.Telegram?.WebApp?.ready?.();
  const ipPromise = lanAllowed().then((ok) => ok ? myIp() : "");
  for (let attempt = 1; ; attempt++) {
    try {
      const info = await homeInfo();
      const ip = await ipPromise;
      if (info.lan && info.home_ip && ip && ip === info.home_ip) {
        $msg.textContent = "Вы дома — открываю напрямую…";
        localStorage.lanTry = Date.now();
        location.replace(info.lan + "/app?l=" + encodeURIComponent(SELF) + HASH);
        return;
      }
      const base = info.url;
      if (base && await alive(base)) {
        $msg.textContent = "Открываю…";
        location.replace(base + "/app?l=" + encodeURIComponent(SELF) + HASH);
        return;
      }
      $msg.textContent = "Дом переподключается…";
      $sub.textContent = attempt > 10 ? "Похоже, компьютер дома выключен или нет интернета" : "";
    } catch (e) {
      $msg.textContent = "Не получается узнать адрес дома";
      $sub.textContent = "Пробую снова…";
    }
    await new Promise((r) => setTimeout(r, attempt < 10 ? 2000 : 5000));
  }
}
go();
</script>
</body>
</html>
